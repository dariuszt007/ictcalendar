<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー管理画面 (Admin)</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { background-color: #f4f6f8; margin: 0; padding: 12px; display: flex; flex-direction: column; align-items: center; }
        .top-bar { width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: #ffffff; padding: 12px 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .calendar-header-title { font-size: 22px; font-weight: bold; color: #1e293b; white-space: nowrap; }
        .dropdown { position: relative; display: inline-block; }
        .btn-menu { background-color: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .dropdown-content { display: none; position: absolute; right: 0; background-color: #ffffff; min-width: 180px; box-shadow: 0px 8px 16px rgba(0,0,0,0.15); border-radius: 8px; overflow: hidden; z-index: 100; }
        .dropdown-content button, .dropdown-content label { color: #334155; padding: 10px 14px; text-decoration: none; display: block; font-size: 13px; font-weight: 500; border: none; background: none; width: 100%; text-align: left; cursor: pointer; }
        .dropdown-content button:hover, .dropdown-content label:hover { background-color: #f1f5f9; }
        .dropdown:hover .dropdown-content { display: block; }
        .calendar-container { width: 100%; max-width: 1000px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); padding: 16px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .day-name { background-color: #334155; color: white; text-align: center; padding: 10px 0; font-weight: bold; border-radius: 6px; font-size: 13px; }
        .day-box { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 6px; min-height: 100px; padding: 6px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
        .day-box.drag-over { background-color: #e0f2fe; border-color: #0284c7; }
        .day-box.empty { background-color: #f1f5f9; border: 1px dashed #cbd5e1; cursor: default; }
        .day-number { font-weight: bold; font-size: 13px; color: #475569; pointer-events: none; }
        .day-box.today { background-color: #eff6ff; border: 2px solid #2563eb; }
        .event-box { font-size: 11px; line-height: 1.35; padding: 6px 8px; border-radius: 5px; color: #ffffff; word-break: break-all; cursor: grab; }
        .event-box.selected-touch { outline: 3px solid #f59e0b; }
        .type-elem { background-color: #2563eb; }
        .type-jhs  { background-color: #d97706; }
        .type-off  { background-color: #dc2626; }
        .type-trg  { background-color: #16a34a; }
        .type-oth  { background-color: #9333ea; }
        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 1000; padding: 16px; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
        .modal label { font-size: 12px; font-weight: bold; color: #475569; }
        .modal input, .modal select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; }
        .btn-save { background: #2563eb; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
        .btn-delete { background: #dc2626; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; margin-right: auto; }
        .btn-cancel { background: #e2e8f0; color: #475569; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
        @media (max-width: 600px) {
            .top-bar { flex-direction: column; gap: 8px; text-align: center; }
            .calendar-grid { gap: 4px; }
            .day-box { min-height: 85px; padding: 4px; }
            .event-box { font-size: 10px; padding: 4px; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="calendar-header-title" id="calendarTitle"></div>
    <div class="dropdown">
        <button class="btn-menu">メニュー (Menu) ▾</button>
        <div class="dropdown-content">
            <button onclick="exportJSON()">JSONをダウンロード</button>
            <button onclick="exportICS()">ICS エクスポート</button>
            <label for="icsFileInput">ICS インポート<input type="file" id="icsFileInput" accept=".ics" style="display:none" onchange="importICS(event)"></label>
            <button onclick="window.location.href='index.html'">サイトを見る (View Only)</button>
        </div>
    </div>
</div>

<div class="calendar-container">
    <div class="calendar-grid" id="calendarGrid">
        <div class="day-name">月 (Pon)</div>
        <div class="day-name">火 (Wt)</div>
        <div class="day-name">水 (Śr)</div>
        <div class="day-name">木 (Czw)</div>
        <div class="day-name">金 (Pt)</div>
    </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="eventModal">
    <div class="modal">
        <h3>イベント編集</h3>
        <div><label>日付:</label><input type="text" id="modalDate" readonly style="background:#f1f5f9;"></div>
        <div><label>内容:</label><input type="text" id="modalText"></div>
        <div>
            <label>カテゴリー:</label>
            <select id="modalCategory">
                <option value="elem">小学校 (Niebieski)</option>
                <option value="jhs">中学校 (Pomarańczowy)</option>
                <option value="off">休み (Czerwony)</option>
                <option value="trg">研修 (Zielony)</option>
                <option value="oth">その他 (Fioletowy)</option>
            </select>
        </div>
        <div class="modal-buttons">
            <button class="btn-delete" id="btnDelete" onclick="deleteEvent()">削除</button>
            <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
            <button class="btn-save" onclick="saveEvent()">保存</button>
        </div>
    </div>
</div>

<script>
    const GITHUB_JSON_URL = 'https://raw.githubusercontent.com/TWOJ_USERNAME/TWOJE_REPO/main/events.json';
    let eventsData = {};
    let currentEditDate = null;
    let selectedDateForMove = null;

    async function loadEventsAndRender() {
        try {
            const res = await fetch(GITHUB_JSON_URL + '?t=' + new Date().getTime());
            if (res.ok) eventsData = await res.json();
        } catch (e) { console.warn("Pobieranie nieudane", e); }
        renderCalendar();
    }

    function renderCalendar() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
        document.getElementById('calendarTitle').innerText = `${year}年 ${monthNames[month]} (Admin)`;

        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const totalDays = lastDay.getDate();

        const grid = document.getElementById('calendarGrid');
        while (grid.children.length > 5) grid.removeChild(grid.lastChild);

        let firstDayOfWeek = firstDay.getDay();
        let emptyBoxesCount = (firstDayOfWeek >= 1 && firstDayOfWeek <= 5) ? firstDayOfWeek - 1 : 0;

        for (let i = 0; i < emptyBoxesCount; i++) {
            const emptyBox = document.createElement('div');
            emptyBox.className = 'day-box empty';
            grid.appendChild(emptyBox);
        }

        for (let day = 1; day <= totalDays; day++) {
            const currentDate = new Date(year, month, day);
            const dayOfWeek = currentDate.getDay();
            if (dayOfWeek === 0 || dayOfWeek === 6) continue;

            const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

            const dayBox = document.createElement('div');
            dayBox.className = 'day-box';
            if (day === now.getDate()) dayBox.classList.add('today');

            const dayNumber = document.createElement('div');
            dayNumber.className = 'day-number';
            dayNumber.innerText = day;
            dayBox.appendChild(dayNumber);

            let event = eventsData[dateKey];
            if (event && event.text) {
                const eventDiv = document.createElement('div');
                eventDiv.className = `event-box type-${event.category || 'elem'}`;
                if (selectedDateForMove === dateKey) eventDiv.classList.add('selected-touch');
                eventDiv.innerText = event.text;
                eventDiv.draggable = true;

                eventDiv.ondragstart = (e) => e.dataTransfer.setData('text/plain', dateKey);
                eventDiv.onclick = (e) => {
                    e.stopPropagation();
                    if (selectedDateForMove === dateKey) { openModal(dateKey, event); selectedDateForMove = null; }
                    else { selectedDateForMove = dateKey; }
                    renderCalendar();
                };
                dayBox.appendChild(eventDiv);
            }

            dayBox.ondragover = (e) => { e.preventDefault(); dayBox.classList.add('drag-over'); };
            dayBox.ondragleave = () => dayBox.classList.remove('drag-over');
            dayBox.ondrop = (e) => {
                e.preventDefault();
                dayBox.classList.remove('drag-over');
                moveEvent(e.dataTransfer.getData('text/plain'), dateKey);
            };

            dayBox.onclick = () => {
                if (selectedDateForMove) { moveEvent(selectedDateForMove, dateKey); selectedDateForMove = null; }
                else { openModal(dateKey, eventsData[dateKey] || null); }
            };

            grid.appendChild(dayBox);
        }
    }

    function moveEvent(from, to) {
        if (from && to && from !== to && eventsData[from]) {
            eventsData[to] = eventsData[from];
            delete eventsData[from];
            renderCalendar();
        }
    }

    function openModal(dateKey, event) {
        currentEditDate = dateKey;
        document.getElementById('modalDate').value = dateKey;
        document.getElementById('modalText').value = event ? event.text : '';
        document.getElementById('modalCategory').value = event ? (event.category || 'elem') : 'elem';
        document.getElementById('btnDelete').style.display = event ? 'block' : 'none';
        document.getElementById('eventModal').classList.add('active');
    }

    function closeModal() { document.getElementById('eventModal').classList.remove('active'); }

    function saveEvent() {
        const text = document.getElementById('modalText').value.trim();
        const category = document.getElementById('modalCategory').value;
        if (text) eventsData[currentEditDate] = { text, category };
        else delete eventsData[currentEditDate];
        closeModal();
        renderCalendar();
    }

    function deleteEvent() { delete eventsData[currentEditDate]; closeModal(); renderCalendar(); }

    function exportJSON() {
        const a = document.createElement('a');
        a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(eventsData, null, 2));
        a.download = "events.json";
        a.click();
    }

    function exportICS() {
        let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Calendar//JP\n";
        for (const [date, ev] of Object.entries(eventsData)) {
            const cleanDate = date.replace(/-/g, '');
            icsContent += `BEGIN:VEVENT\nSUMMARY:${ev.text}\nDTSTART;VALUE=DATE:${cleanDate}\nEND:VEVENT\n`;
        }
        icsContent += "END:VCALENDAR";
        const a = document.createElement('a');
        a.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(icsContent);
        a.download = "calendar.ics";
        a.click();
    }

    function importICS(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            const lines = evt.target.result.split('\n');
            let currentDate = null, currentText = null;
            lines.forEach(line => {
                if (line.startsWith('DTSTART')) {
                    const match = line.match(/\d{8}/);
                    if (match) currentDate = `${match[0].substr(0,4)}-${match[0].substr(4,2)}-${match[0].substr(6,2)}`;
                } else if (line.startsWith('SUMMARY:')) {
                    currentText = line.replace('SUMMARY:', '').trim();
                } else if (line.startsWith('END:VEVENT')) {
                    if (currentDate && currentText) eventsData[currentDate] = { text: currentText, category: 'elem' };
                    currentDate = null; currentText = null;
                }
            });
            renderCalendar();
        };
        reader.readAsText(file);
    }

    loadEventsAndRender();
</script>
</body>
</html>
